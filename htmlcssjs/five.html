<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <script>
        function fnStore(){
            var id = document.getElementById("productId").value;
            var name = document.getElementById("productName").value;
            var category = document.getElementById("productCategory").value;
            var price = document.getElementById("productPrice").value;
            var product = {
                id: id,
                name: name,
                category: category,
                price: price
            };
            alert(JSON.stringify(product));
        }

        function fnLoad(){
            var txtJSON = document.getElementById("txtJSON").value;
            var product = JSON.parse(txtJSON);
            document.getElementById("productId").value = product.id;
            document.getElementById("productName").value = product.name;
            document.getElementById("productCategory").value = product.category;
            document.getElementById("productPrice").value = product.price;
        }   
    </script>
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow">
                    <div class="card-header bg-primary text-white">
                        <h2 class="mb-0">Product Form</h2>
                    </div>
                    <div class="card-body">
                        <input type="text" name="" id="txtJSON">
                        <input type="button" value="Load" onclick="fnLoad()">
                        <form id="productForm">
                            <div class="mb-3">
                                <label for="productId" class="form-label">ID</label>
                                <input type="text" class="form-control" id="productId" name="productId" required>
                            </div>
                            <div class="mb-3">
                                <label for="productName" class="form-label">Name</label>
                                <input type="text" class="form-control" id="productName" name="productName" required>
                            </div>
                            <div class="mb-3">
                                <label for="productCategory" class="form-label">Category</label>
                                <select class="form-select" id="productCategory" name="productCategory" required>
                                    <option value="">Select Category</option>
                                    <option value="Electronics">Electronics</option>
                                    <option value="Clothing">Clothing</option>
                                    <option value="Books">Books</option>
                                    <option value="Home">Home</option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label for="productPrice" class="form-label">Price</label>
                                <input type="number" class="form-control" id="productPrice" name="productPrice" required min="0" step="0.01">
                            </div>
                            <div class="d-grid">
                                <button type="submit" class="btn btn-primary" onclick="fnStore()" >Save</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
